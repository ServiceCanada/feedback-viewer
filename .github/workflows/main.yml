name: Deploy to AKS Cluster
on:
  push:
    branches:
      - main
# id-token lets the run request a short-lived OIDC token to present to
# Azure, in place of a stored service principal secret.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo's logs are public, and the ingress holds the IP allowlist.
      # Registering every IP in it as a secret makes GitHub replace them with ***
      # in all later output in this job, whichever step prints them. The mask
      # commands are consumed by the runner and are not shown in the log.
      - name: Mask ingress IPs
        env:
          INGRESS_ALLOWLIST: ${{ secrets.INGRESS_ALLOWLIST }}
        run: |
          if [ -z "$INGRESS_ALLOWLIST" ]; then
            echo "::error::Set the INGRESS_ALLOWLIST repository secret."
            exit 1
          fi
          echo "$INGRESS_ALLOWLIST" | tr ', ' '\n\n' | sed 's|/.*||; /^$/d' | sort -u | sed 's/^/::add-mask::/'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build with Maven
        run: mvn install --file pom.xml

      # Federated credential: Azure trusts GitHub's signed token for this
      # repository and branch. The IDs below are identifiers, not passwords;
      # they are stored as secrets so GitHub masks them in the public logs.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Authenticates docker to the registry using the session above.
      - name: Log in to the container registry
        run: az acr login --name tbsacr

      - run: |
          docker build -f ./docker/Dockerfile . -t tbsacr.azurecr.io/feedback-viewer:${{ github.sha }}
          docker push tbsacr.azurecr.io/feedback-viewer:${{ github.sha }}

      # Set the target AKS cluster.
      - uses: Azure/aks-set-context@v5
        with:
          cluster-name: tbs-prod-aks
          resource-group: tbs-prod-rg

      - name: Apply runtime secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$JWT_SECRET_KEY" ]; then
            echo "::error::Set the MONGODB_URI and JWT_SECRET_KEY repository secrets."
            exit 1
          fi
          if ! kubectl create secret generic feedback-viewer-secrets --namespace pagesuccess \
              --from-literal=SPRING_DATA_MONGODB_URI="$MONGODB_URI" \
              --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
              --dry-run=client -o yaml | kubectl apply -f - > /dev/null 2>&1; then
            echo "::error::Applying feedback-viewer-secrets failed."
            exit 1
          fi
          echo "Runtime secrets applied."

      - uses: Azure/k8s-deploy@v6
        with:
          manifests: |
            kubernetes/feedback-viewer-deployment.yml
            kubernetes/feedback-viewer-service.yml
          images: |
            tbsacr.azurecr.io/feedback-viewer:${{ github.sha }}
          namespace: |
            pagesuccess

      # Applied outside k8s-deploy, which prints every ingress it deploys as
      # JSON. Output is discarded because kubectl errors can quote values from
      # the file.
      - name: Apply ingress
        env:
          INGRESS_ALLOWLIST: ${{ secrets.INGRESS_ALLOWLIST }}
        run: |
          if ! envsubst '${INGRESS_ALLOWLIST}' < kubernetes/feedback-viewer-ingress.yml \
              | kubectl apply --namespace pagesuccess -f - > /dev/null 2>&1; then
            echo "::error::Applying the ingress failed."
            exit 1
          fi
          echo "Ingress applied."
