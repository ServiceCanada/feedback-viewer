name: Check formatting
on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # If either step fails, run `make fmt` and commit the result.
      - name: Check Java formatting
        run: mvn -q spotless:check

      - name: Check formatting of other files
        if: ${{ !cancelled() }}
        run: |
          docker build -q -t fmt docker/fmt
          docker run --rm -v "$PWD":/app -w /app fmt sh docker/fmt/fmt.sh --check
