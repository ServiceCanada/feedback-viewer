# Validates that a pull request would build and deploy cleanly, without
# touching the cluster. The deploy itself runs from main.yml on push to
# main, after review.
name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # The build and tests don't need the encrypted application.properties,
      # so no secrets are decrypted here and pull requests from forks run in full.
      - name: Build and test
        run: mvn -B verify

      # Build only. Nothing is pushed to the registry and no image tagged
      # here can reach the cluster.
      - name: Build image
        run: docker build -f ./docker/Dockerfile . -t feedback-viewer:${{ github.sha }}

      # Validates the manifests main.yml deploys against the Kubernetes schemas
      # offline. The ingress is left out on purpose: it is encrypted because it
      # holds the IP allowlist, and decrypting it here would put it within reach
      # of pull request code whose logs are public. Check it locally with
      # `make check-ingress` before re-encrypting it.
      - name: Validate Kubernetes manifests
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary kubernetes/feedback-viewer-deployment.yml kubernetes/feedback-viewer-service.yml
