spring.data.mongodb.uri=mongodb://localhost:27017/pagesuccess
spring.data.mongodb.database=pagesuccess
jwt.secret.key=local-dev-only-jwt-secret-not-for-prod
server.servlet.session.timeout=4h
spring.threads.virtual.enabled=true

# Disable DevTools restart to prevent ClassLoader isolation issues with cache warming.
# DevTools restart causes cached values to become orphaned across ClassLoader boundaries.
spring.devtools.restart.enabled=false

gc.ip.filter.enabled=false
